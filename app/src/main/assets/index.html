
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS AUDIO DLMS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;
    background: #080808;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

.panel {
    width: 100%;
    max-width: 480px;
    padding: 25px 20px;
    background: #151515;
    border: 1px solid #333;
    border-top: 4px solid #e00000;
    border-radius: 12px;
    text-align: center;
}

h1 {
    color: #f00000;
    letter-spacing: 3px;
    margin-bottom: 5px;
}

h2 {
    margin-top: 5px;
}

.subtitle {
    color: #999;
    font-size: 13px;
}

button {
    margin-top: 22px;
    padding: 16px 22px;
    width: 100%;
    border: 0;
    border-radius: 8px;
    background: #d90000;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

button:active {
    background: #900000;
}

.status {
    margin-top: 22px;
    padding: 12px;
    background: #090909;
    border: 1px solid #333;
    border-radius: 8px;
    color: #00dd77;
    font-size: 13px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.meters {
    margin-top: 25px;
    padding: 16px;
    background: #0b0b0b;
    border: 1px solid #333;
    border-radius: 8px;
    text-align: left;
}

.meter-title {
    margin-bottom: 18px;
    color: #ddd;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    letter-spacing: 1px;
}

.channel {
    margin-top: 16px;
}

.channel-head {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
    color: #ccc;
    font-size: 13px;
}

.track {
    height: 17px;
    width: 100%;
    background: #292929;
    border: 1px solid #444;
    border-radius: 4px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(
        90deg,
        #00a84f,
        #a6df00,
        #ffb000,
        #f00000
    );
    transition: width 0.1s linear;
}

.note {
    margin-top: 14px;
    color: #777;
    font-size: 11px;
    text-align: center;
}
</style>
</head>

<body>
<div class="panel">

    <h1>AS AUDIO</h1>
    <h2>DLMS ANDROID</h2>
    <p class="subtitle">
        Digital Loudspeaker Management System
    </p>

    <button onclick="testAudioCapture()">
        TEST AUDIO CAPTURE
    </button>

    <div class="status" id="status">
        ANDROID ENGINE READY
    </div>

    <div class="meters">
        <div class="meter-title">STEREO PCM MONITOR</div>

        <div class="channel">
            <div class="channel-head">
                <span>LEFT CHANNEL (L)</span>
                <span id="leftValue">0.000</span>
            </div>
            <div class="track">
                <div class="bar" id="leftBar"></div>
            </div>
        </div>

        <div class="channel">
            <div class="channel-head">
                <span>RIGHT CHANNEL (R)</span>
                <span id="rightValue">0.000</span>
            </div>
            <div class="track">
                <div class="bar" id="rightBar"></div>
            </div>
        </div>

        <div class="note">
            PCM 48 kHz • 16-BIT • STEREO
        </div>
    </div>

</div>

<script>
function testAudioCapture() {
    if (window.Android &&
        typeof Android.requestAudioCapture === "function") {

        document.getElementById("status").textContent =
            "MENUNGGU IZIN AUDIO CAPTURE...";

        Android.requestAudioCapture();

    } else {
        document.getElementById("status").textContent =
            "ANDROID BRIDGE TIDAK TERDETEKSI";
    }
}

window.onCapturePermissionResult = function(granted) {
    const status = document.getElementById("status");

    if (granted) {
        status.textContent =
            "IZIN CAPTURE DIBERIKAN - MENUNGGU DATA PCM";
    } else {
        status.textContent = "IZIN CAPTURE DITOLAK";
    }
};

window.onAudioCaptureUpdate = function(message, left, right) {
    const status = document.getElementById("status");

    const l = Math.max(0, Math.min(1, Number(left) || 0));
    const r = Math.max(0, Math.min(1, Number(right) || 0));

    status.textContent = message;

    document.getElementById("leftValue").textContent =
        l.toFixed(3);

    document.getElementById("rightValue").textContent =
        r.toFixed(3);

    // Skala visual meter: RMS 0.20 ditampilkan sebagai 100%.
    document.getElementById("leftBar").style.width =
        Math.min(100, l * 500) + "%";

    document.getElementById("rightBar").style.width =
        Math.min(100, r * 500) + "%";
};
</script>
</body>
</html>
