<!DOCTYPE html>

<title>AS AUDIO DLMS</title>

<style>
* {

}

body {

    background: #080808;
    color: #eeeeee;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;

    text-align: center;

.panel {

h1 {

p {
    color: #aaa;
}

.status {
    margin-top: 25px;
    color: #00dd77;
    font-size: 13px;
}

<div class="panel">
