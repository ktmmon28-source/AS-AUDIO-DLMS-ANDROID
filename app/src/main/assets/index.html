
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS AUDIO DLMS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.panel {
    width: 90%;
    max-width: 480px;
    padding: 30px 20px;
    background: #151515;
    border: 1px solid #333;
    border-top: 4px solid #e00000;
    border-radius: 12px;
}

h1 {
    color: #f00000;
    letter-spacing: 3px;
}

p {
    color: #aaa;
}

button {
    margin-top: 25px;
    padding: 16px 22px;
    width: 100%;
    border: 0;
    border-radius: 8px;
    background: #d90000;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

button:active {
    background: #900000;
}

.status {
    margin-top: 24px;
    color: #00dd77;
    font-size: 13px;
    line-height: 1.6;
}
</style>
</head>

<body>
<div class="panel">
    <h1>AS AUDIO</h1>
    <h2>DLMS ANDROID</h2>
    <p>Digital Loudspeaker Management System</p>

    <button onclick="testAudioCapture()">
        TEST AUDIO CAPTURE
    </button>

    <div class="status" id="status">
        ANDROID ENGINE READY
    </div>
</div>

<script>
function testAudioCapture() {
    if (window.Android &&
        typeof Android.requestAudioCapture === "function") {

        document.getElementById("status").textContent =
            "MENUNGGU IZIN AUDIO CAPTURE...";

        Android.requestAudioCapture();

    } else {
        document.getElementById("status").textContent =
            "ANDROID BRIDGE TIDAK TERDETEKSI";
    }
}

window.onCapturePermissionResult = function(granted) {
    const status = document.getElementById("status");

    if (granted) {
        status.textContent =
            "IZIN CAPTURE DIBERIKAN";
    } else {
        status.textContent =
            "IZIN CAPTURE DITOLAK";
    }
};
</script>
</body>
</html>
